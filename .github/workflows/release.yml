name: Release & Marketplace Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm registry'
        required: true
        type: boolean
        default: true
      update_major_tag:
        description: 'Update major version tag (e.g. v1) for GitHub Actions'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Verify CLI Execution
        run: node dist/cli/index.js check fixtures/valid-app

  publish-npm:
    name: Publish to npm
    needs: test-and-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to npm (Provenance Enabled)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "shopify-edge-guardian@$CURRENT_VERSION" version > /dev/null 2>&1; then
            echo "::notice ::shopify-edge-guardian@$CURRENT_VERSION is already published on npm. Skipping publication."
          else
            npm publish --provenance --access public
          fi

  release-marketplace:
    name: GitHub Marketplace & Tag Release
    needs: [test-and-build, publish-npm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.update_major_tag == 'true')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Versions
        id: version_info
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR_TAG="v${BASH_REMATCH[1]}"
            echo "major_tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "major_tag=v1" >> "$GITHUB_OUTPUT"
            echo "release_tag=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Floating Major Tag (e.g. v1)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.version_info.outputs.major_tag }}" -m "Update floating action tag ${{ steps.version_info.outputs.major_tag }} to ${{ steps.version_info.outputs.release_tag }}"
          git push origin "${{ steps.version_info.outputs.major_tag }}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_info.outputs.release_tag }}
          name: Release ${{ steps.version_info.outputs.release_tag }}
          generate_release_notes: true
          files: |
            action.yml
            README.md
